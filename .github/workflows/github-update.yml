---
name: GitHub Update
# checkov:skip=CKV_GHA_7:force input deliberately bypasses the same-day duplicate guard for rare manual re-runs (regenerating after a bad merge)
on:
  schedule:
    # 11:42 UTC = 4:42am Pacific (PDT) / 3:42am (PST). Counterintuitively, scheduling
    # later runs earlier: the schedule-queue backlog (global midnight-UTC crunch)
    # doesn't drain until ~13:00 UTC, so earlier slots (8:42, 10:42) all landed
    # 13:22-17:00 UTC in Sep-Oct 2026. See Apr-May 2026: 11:00 UTC ran on time.
    - cron: '42 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the same-day duplicate guard (run even if today''s update PR exists or is merged)'
        required: false
        default: false
        type: boolean

# Serialize schedule + workflow_dispatch runs. A newer pending run replaces an
# older pending one, but an in-progress run is never killed mid-step (it pushes
# branches and creates PRs; preemption could orphan a branch). Duplicate same-day
# work is stopped by the guard job instead. To preempt a stuck run, cancel it
# manually first. See issue #544 for context and observed collisions.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# global permissions
permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      today: ${{ steps.check.outputs.today }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check for existing update PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh needs no checkout when the repo is named explicitly
          # (#551: without this, `gh pr list` failed with "failed to run
          # git: fatal: not a git repository" in every guard run, the if
          # fell through to fail-open skip=false, and the guard never
          # skipped anything).
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          # Note: an error from `gh pr list` itself is treated as "skip the
          # run" (fail-closed): the update re-fetches cumulatively, so a
          # skipped day costs nothing tomorrow, while a fail-open duplicate
          # (#546/#547/#551) is the demonstrated pain. The deterministic
          # git-context failure behind #551 is fixed by GH_REPO above; this
          # now only triggers for genuine API errors, which should not
          # create a possibly-duplicate PR.
          TODAY="$(date -u +%Y-%m-%d)"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${FORCE:-}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "force=true — bypassing the same-day duplicate guard."
            exit 0
          fi
          # Skip when today's update PR is in a state that means "done or in
          # flight". OPEN means an update is pending review (the #545 behavior).
          # MERGED means today's update already landed — a same-day re-run
          # would only re-record the merge commit itself (the #546/#547 dupe:
          # a backlogged scheduled run started after #546 was merged, so the
          # open-PR-only guard saw nothing and recreated the update from the
          # #546 squash-merge commit alone). CLOSED (unmerged) stays allowed,
          # so a failed run + manual retry (the Oct 3/Oct 5 pattern) still works.
          # stderr flows to the log unfiltered: the failure detail is the
          # diagnostic (it's how #551 was root-caused from old run logs).
          set +e
          PRS=$(gh pr list --state all --limit 200 --json headRefName,state \
            --jq '.[] | select(.state == "OPEN" or .state == "MERGED") | .headRefName')
          GH_RC=$?
          set -e
          if [ "$GH_RC" -ne 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::gh pr list failed (rc=$GH_RC) — failing closed: skipping today's run to avoid a possible duplicate PR."
            exit 0
          fi
          if echo "$PRS" | grep -q "^automation/${TODAY}-github-update"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Open or already-merged github-update PR for $TODAY exists — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  github-update:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        # zizmor: ignore[artipacked] - needs credentials to push the update branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: |
            lottery/go.sum
            individuals/chicks/github/go.sum
            individuals/chicks/youtube/go.sum
            individuals/chicks/ccusage/go.sum

      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: '4.4'

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1'

      - name: Install R packages
        run: "just install-r-deps"

      - name: Create update branch
        id: branch
        env:
          TODAY: ${{ needs.guard.outputs.today }}
        run: |
          BRANCH_NAME="automation/${TODAY}-github-update-${GITHUB_RUN_NUMBER}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Run GitHub update
        env:
          GOTOOLCHAIN: auto
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just _github-update-ci

      - name: Analyze star history
        env:
          GH_TOKEN: ${{ secrets.GH_STAR_TOKEN }}
        run: |
          just analyze-star-history
          git add individuals/chicks/github

      - name: Check for changes
        id: changes
        run: |
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select random emoji
        id: emoji
        run: |
          EMOJIS=("🚀" "📊" "🔄" "✨" "📈" "🤖" "📝" "🎯" "💡" "🔥" "🚗" "🚌" "🚲" "✈️" "🚂" "🚁" "🛸" "🚢" "🚕" "🚓" "🚒" "🚚" "🚛" "🚜" "⬛" "⬜" "🔴" "🟠" "🟡" "🟢" "🔵" "🟣" "⚫" "⚪" "🔶" "🔷" "🔺" "🔻" "💠" "⭐")
          RANDOM_EMOJI=${EMOJIS[$((RANDOM % ${#EMOJIS[@]}))]}
          echo "emoji=$RANDOM_EMOJI" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          RANDOM_EMOJI: ${{ steps.emoji.outputs.emoji }}
          TODAY: ${{ needs.guard.outputs.today }}
        run: |
          git config user.name 'Christopher Hicks'
          git config user.email 'chicks@chicks.net'
          git commit -m "$RANDOM_EMOJI [github] Update GitHub data ($TODAY)"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_CREATION }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          RANDOM_EMOJI: ${{ steps.emoji.outputs.emoji }}
          TODAY: ${{ needs.guard.outputs.today }}
        run: |
          git push -u origin "$BRANCH_NAME"
          gh pr create \
            --title "$RANDOM_EMOJI [github] Update GitHub data ($TODAY)" \
            --body "## Summary

          Automated daily GitHub data update.

          ### Updated

          - Commit history (commits.db)
          - Contribution counts (contributions.db)
          - Comment history (comments.db)
          - Analysis visualizations (contributions, star history charts)

          ## Meta

          Triggered by scheduled workflow." \
            --base main
